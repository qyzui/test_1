name: TWRP Test Build2

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP/OFRP manifest repository URL'
        required: true
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git'
      manifest_branch:
        description: 'Manifest branch'
        required: true
        default: 'twrp-16.0'
      recovery_url:
        description: 'Pinned bootable/recovery repository URL'
        required: true
        default: 'https://github.com/qyzui/android_bootable_recovery.git'
      recovery_branch:
        description: 'Pinned bootable/recovery branch'
        required: true
        default: 'twrp-16.0'
      device_tree_url:
        description: 'Device tree repository URL'
        required: true
        default: 'https://github.com/qyzui/7.git'
      device_tree_branch:
        description: 'Device tree branch'
        required: true
        default: 'twrp-16.0'
      device_name:
        description: 'Device codename / product name'
        required: true
        default: 'infiniti'
      lunch_target:
        description: 'lunch target'
        required: true
        default: 'twrp_infiniti'
      device_tree_path:
        description: 'Device tree path under the Android source tree'
        required: true
        default: 'device/oplus/infiniti'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MANIFEST_URL: ${{ inputs.manifest_url }}
      MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
      RECOVERY_URL: ${{ inputs.recovery_url }}
      RECOVERY_BRANCH: ${{ inputs.recovery_branch }}
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_NAME: ${{ inputs.device_name }}
      LUNCH_TARGET: ${{ inputs.lunch_target }}
      DEVICE_TREE_PATH: ${{ inputs.device_tree_path }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      GH_TOKEN: ${{ secrets.PRIVATE_7_TOKEN }}
    steps:
      - name: Global Git Safety & Secret Mask
        shell: bash
        run: |
          set -euo pipefail
          # 屏蔽Token日志输出
          echo "::add-mask::${GH_TOKEN}"
          export GIT_TERMINAL_PROMPT=0
          git config --global --add safe.directory "*"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses6 libncurses-dev \
            libssl-dev libxml2-utils lz4 lzip pngcrush rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          git lfs install --system

      - name: Free maximum available disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Configure swap
        shell: bash
        run: |
          set -e
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
          SWAP_MB=$((TOTAL_RAM_MB * 2))
          [ "$SWAP_MB" -lt 8192 ] && SWAP_MB=8192
          [ "$SWAP_MB" -gt 32768 ] && SWAP_MB=32768
          sudo fallocate -l "${SWAP_MB}M" /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=${SWAP_MB}
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=10G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          # 固定前缀，不带run_id，缓存可跨流水线复用
          key: ${{ runner.os }}-twrp16-ccache-${{ inputs.lunch_target }}
          restore-keys: |
            ${{ runner.os }}-twrp16-ccache-

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Repo sync source tree
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf .repo out bootable/recovery "$DEVICE_TREE_PATH"
          "$HOME/bin/repo" init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          "$HOME/bin/repo" sync -c --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune -j"$(nproc --all)"

      - name: Pin custom bootable recovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf bootable/recovery
          mkdir -p bootable
          git clone --depth=1 --single-branch --branch "$RECOVERY_BRANCH" "$RECOVERY_URL" bootable/recovery
          echo "Recovery HEAD: $(git -C bootable/recovery rev-parse --short HEAD)"

      - name: Fetch private device tree (safe token injection)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$(dirname "$DEVICE_TREE_PATH")"
          # 临时带Token远程，克隆完成清除密钥，兼容任意输入device_tree_url
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/qyzui/7.git"
          git clone --depth=1 --single-branch --branch "$DEVICE_TREE_BRANCH" \
            "$AUTH_URL" "$DEVICE_TREE_PATH"
          # 清除本地仓库保存的鉴权信息，杜绝密钥泄露
          git -C "$DEVICE_TREE_PATH" remote set-url origin "$DEVICE_TREE_URL"

      - name: Apply patches (fault tolerant)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          PATCH_ROOT="$GITHUB_WORKSPACE/$DEVICE_TREE_PATH/patches"
          [ ! -d "$PATCH_ROOT" ] && echo "No patch dir, skip" && exit 0

          mapfile -d '' PATCHES < <(find "$PATCH_ROOT" -type f -name '*.patch' -print0 | sort -z)
          [ "${#PATCHES[@]}" -eq 0 ] && echo "No patch files" && exit 0

          for patch in "${PATCHES[@]}"; do
            rel="${patch#"$PATCH_ROOT"/}"
            target_dir="$GITHUB_WORKSPACE/$(dirname "$rel")"
            mkdir -p "$target_dir"

            reject_file="$RUNNER_TEMP/$(echo "$rel" | tr '/' '_').rej"
            rm -f "$reject_file"

            echo "Applying patch: $rel"
            patch -d "$target_dir" -p1 --forward --batch --reject-file "$reject_file" < "$patch" || true

            if [ -s "$reject_file" ]; then
              echo "Patch conflict: $rel"
              cat "$reject_file"
              exit 1
            fi
          done

      - name: Build recovery image
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          # 构建前释放 repo/git 元数据空间
          rm -rf .repo
          find . -type d -name .git -prune -exec rm -rf {} +
          df -h

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_NOHASHDIR=1
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,file_macro
          export CCACHE_COMPILERCHECK=content

          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          # 多核编译加速
          mka -j"$(nproc --all)" recoveryimage

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Prepare timestamped recovery artifacts
        if: success()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          TIMESTAMP="$(date '+%Y%m%d_%H%M%S')"
          PRODUCT_DIR="out/target/product/${DEVICE_NAME}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$PRODUCT_DIR/recovery.img" "$GITHUB_WORKSPACE/artifacts/recovery_${TIMESTAMP}.img"
          cp "$PRODUCT_DIR/vendor_boot.img" "$GITHUB_WORKSPACE/artifacts/vendor_boot_${TIMESTAMP}.img"
          echo "Timestamp: $TIMESTAMP"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: twrp-${{ inputs.device_name }}-recovery-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
